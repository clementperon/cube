[package]
name = "pg-srv"
version = "0.3.0"
authors = ["Cube Dev, Inc."]
edition = "2018"
license = "Apache-2.0"
description = "Library for emulating a PostgreSQL server"
documentation = "https://docs.cube.dev"
homepage = "https://cube.dev"

[features]
with-jiff = ["jiff"]
default = ["with-jiff"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1.36"
log = "0.4"
bytes = "1.2"
byteorder = "1.4"
thiserror = "2"
jiff = { version = "1.0.0", default-features = false, features = [
    "std",
    "tz-fat",
    "tzdb-bundle-always",
    "perf-inline",
], optional = true }

[dev-dependencies]
hex = "0.4.3"

# Code in cubesql workspace is not ready for full-blown clippy
# So we disable some rules to enable per-rule latch in CI, not for a whole clippy run
# Feel free to remove any rule from here and fix all warnings with it
# Or to write a comment why rule should stay disabled
[lints.clippy]
len_without_is_empty = "allow"
new_without_default = "allow"
